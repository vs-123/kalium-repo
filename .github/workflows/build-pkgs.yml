name: BUILD CUSTOM PACKAGES
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-musl-full
      options: --privileged

    steps:
      - name: CHECKOUT REPO
        uses: actions/checkout@v4

      - name: PREPARE ENVIRONMENT
        run: |
          xbps-install -Sy git base-devel
          git config --global --add safe.directory /__w/kalium-repo/kalium-repo

      - name: BUILD PACKAGES
        run: |
          ./xbps-src binary-bootstrap
          ./xbps-src pkg kalium-base-files
          ./xbps-src pkg kalium-base-system

      - name: CREATE LOCAL REPO INDEX
        run: |
          xbps-rindex -a hostdir/binpkgs/*.xbps

      - name: UPLOAD REPO AS ARTIFACT
        uses: actions/upload-artifact@v4
        with:
          name: kalium-binpkgs
          path: hostdir/binpkgs/
